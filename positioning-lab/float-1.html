<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Lab</title>
    <style type="text/css">
    /* ---------------Box Sizing----------------- */
    html {
        box-sizing: border-box;
    }
    *,
    *:before,
    *:after {
        box-sizing: inherit;
    }
    body {
        background-color: #ECECEC;
        font-weight: bold;
        font-family: Tahoma, Geneva, sans-serif;
        color: #FFF;
        text-align: center;
        line-height: 24px;
    }
    #wrapper {
        background-color: #FFF;
        border: 1px solid #c0c0c0;
        width: 800px;
        margin-right: auto;
        margin-left: auto;
        text-shadow: 2px 2px #000;
    }
    #navy {
        background-color: #001f3f;
        width: 370px;
        height: 150px;
        float:left;
        margin:20px 0 0 20px;
    }
    #teal {
        background-color: #39CCCC;
        width: 370px;
        height: 150px;
        float:right;
        margin: 20px 20px 0 0;
    }
    #blue {
        background-color: #0074D9;
        width: 370px;
        height: 150px;
        float:left;
        margin:20px 0 20px 20px;
    }
    #aqua {
        background-color: #7FDBFF;
        width: 370px;
        height: 150px;
        float:right;
        margin:20px 20px 20px 0;
    }
    #footer {
        background-color: #666;
        clear:both;
        width:760px;
        margin:20px;
    }
    h1 {
        color: #000;
        font-weight: normal;
        padding: 50px;
    }
    /* two column isn't ideal since it's hard-coded, and additional content has to be done accordingly*/
    /* you can float all of them to the left and clear footer to remove it from the float space ideal. */
    /* adding padding to the container allows the visual of a top margin with one declaration. */
    /* collapsing margin bug is top and bottom only. */
    /* you can also apply the repeated elements to a class, applying to the boxes. */
    /* when you make these a repeated pattern, you can add a class to each element and edit this instead.*/
    /* thus it's ideal for solutions to be as repetitive as possible */

    </style>
</head>
<body>
    <h1>Exercise 1</h1>
        <section id="wrapper">
        <div id="navy">Navy</div>
        <div id="teal">Teal</div>
        <div id="blue">Blue</div>
        <div id="aqua">Aqua</div>
        <div id="footer">Footer</div>
        </section>
</body>

</html>
